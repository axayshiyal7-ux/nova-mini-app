<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA Earn</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }

    .app {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 42px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .welcome {
      margin-top: 8px;
      color: #aab3c5;
      font-size: 14px;
    }

    .balance-card {
      background: #151d33;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      margin-bottom: 15px;
    }

    .balance-label {
      color: #aab3c5;
      font-size: 14px;
    }

    .balance {
      font-size: 38px;
      font-weight: bold;
      margin-top: 8px;
    }

    .price {
      color: #72a7ff;
      margin-top: 5px;
    }

    .buttons {
      display: grid;
      gap: 12px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #2878ff;
      color: white;
    }

    .secondary {
      background: #202b45;
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .stat {
      background: #151d33;
      border-radius: 14px;
      padding: 15px 5px;
      text-align: center;
    }

    .stat-number {
      font-size: 20px;
      font-weight: bold;
    }

    .stat-label {
      color: #aab3c5;
      font-size: 11px;
      margin-top: 5px;
    }

    .message {
      background: #151d33;
      border-radius: 14px;
      padding: 14px;
      margin-top: 15px;
      text-align: center;
      color: #aab3c5;
      font-size: 13px;
      min-height: 45px;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      color: #72a7ff;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div class="logo">🚀</div>

      <h1>NOVA Earn</h1>

      <div class="welcome" id="welcome">
        Connecting to Telegram...
      </div>
    </div>

    <div class="balance-card">

      <div class="balance-label">
        Your NOVA Balance
      </div>

      <div class="balance" id="balance">
        0.0000000
      </div>

      <div class="price">
        NOVA Price: $0.0001
      </div>

    </div>

    <div class="buttons">

      <button class="primary" onclick="watchAd()">
        🎬 Watch Ad
      </button>

      <button class="secondary" onclick="referral()">
        👥 Invite Friends
      </button>

      <button class="secondary" onclick="withdraw()">
        💳 Withdraw NOVA
      </button>

    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-number" id="today">
          0
        </div>

        <div class="stat-label">
          Today's NOVA
        </div>
      </div>

      <div class="stat">
        <div class="stat-number" id="ads">
          0
        </div>

        <div class="stat-label">
          Ads Watched
        </div>
      </div>

      <div class="stat">
        <div class="stat-number" id="refs">
          0
        </div>

        <div class="stat-label">
          Referrals
        </div>
      </div>

    </div>

    <div class="message" id="message">
      Starting NOVA...
    </div>

    <div class="status" id="status">
      Connecting...
    </div>

  </div>

<script>

  // ==========================================
  // TELEGRAM
  // ==========================================

  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();


  // ==========================================
  // SUPABASE EDGE FUNCTION
  // ==========================================

  const FUNCTION_URL =
    "https://ggxcsxwvfntynersipax.supabase.co/functions/v1/telegram-auth";


  // ==========================================
  // LOCAL DISPLAY VALUES
  // ==========================================

  let balance = 0;
  let today = 0;
  let ads = 0;
  let refs = 0;


  // ==========================================
  // TELEGRAM LOGIN
  // ==========================================

  async function loginTelegram() {

    try {

      document.getElementById("status").textContent =
        "Connecting to NOVA server...";


      // Check Telegram WebApp

      if (!window.Telegram || !window.Telegram.WebApp) {

        throw new Error(
          "Telegram WebApp is not available"
        );

      }


      // Telegram initData

      const initData = tg.initData;


      if (!initData) {

        throw new Error(
          "Telegram initData is empty"
        );

      }


      // Send Telegram data to Supabase

      const response = await fetch(
        FUNCTION_URL,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            initData: initData
          })
        }
      );


      const data = await response.json();


      // Check server response

      if (!response.ok || !data.success) {

        throw new Error(
          data.error || "Telegram authentication failed"
        );

      }


      // Telegram user

      const user = data.user;


      // Display username

      let name = user.first_name || "User";


      if (user.last_name) {

        name += " " + user.last_name;

      }


      document.getElementById("welcome").textContent =
        "Welcome, " + name + " 👋";


      document.getElementById("status").textContent =
        "🟢 Connected";


      document.getElementById("message").textContent =
        "NOVA account connected successfully.";


      console.log(
        "Telegram user:",
        user
      );

    }

    catch (error) {

      console.error(error);


      document.getElementById("welcome").textContent =
        "Telegram connection failed";


      document.getElementById("status").textContent =
        "🔴 Connection error";


      document.getElementById("message").textContent =
        error.message;

    }

  }


  // ==========================================
  // WATCH AD
  // ==========================================

  function watchAd() {

    document.getElementById("message").textContent =
      "🎬 Ad system will be connected next.";

  }


  // ==========================================
  // REFERRAL
  // ==========================================

  function referral() {

    document.getElementById("message").textContent =
      "👥 Referral system will be connected next.";

  }


  // ==========================================
  // WITHDRAW
  // ==========================================

  function withdraw() {

    document.getElementById("message").textContent =
      "💳 Withdrawal system will be connected next.";

  }


  // ==========================================
  // START
  // ==========================================

  loginTelegram();

</script>

</body>
</html>
