<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA Earn</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b1020;
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 480px;
      margin: auto;
      padding: 20px;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin: 20px 0 5px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    .balance {
      background: linear-gradient(135deg, #18244a, #101936);
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      margin-bottom: 20px;
    }

    .balance-title {
      color: #9ca3af;
      font-size: 14px;
    }

    .balance-amount {
      font-size: 36px;
      font-weight: bold;
      margin: 10px 0;
    }

    .price {
      color: #9ca3af;
    }

    .buttons {
      display: grid;
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 17px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #4f7cff;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .card {
      background: #141b31;
      border-radius: 18px;
      padding: 20px;
      margin-top: 18px;
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .stat {
      background: #141b31;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
    }

    .stat-number {
      font-size: 22px;
      font-weight: bold;
      margin-top: 6px;
    }

    .message {
      text-align: center;
      color: #9ca3af;
      margin-top: 15px;
      min-height: 22px;
    }

    .footer {
      text-align: center;
      color: #6b7280;
      margin-top: 30px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="logo">🚀 NOVA</div>
    <div class="subtitle">Earn NOVA by watching ads</div>

    <div class="balance">
      <div class="balance-title">YOUR BALANCE</div>
      <div class="balance-amount" id="balance">0 NOVA</div>
      <div class="price">NOVA Price: $0.0001</div>
    </div>

    <div class="buttons">
      <button onclick="watchAd()">🎬 Watch Ad</button>
      <button onclick="referral()">👥 Invite Friends</button>
      <button onclick="withdraw()">💰 Withdraw</button>
    </div>

    <div class="stats">
      <div class="stat">
        <div>Today's Earnings</div>
        <div class="stat-number" id="today">0 NOVA</div>
      </div>

      <div class="stat">
        <div>Referrals</div>
        <div class="stat-number" id="refs">0</div>
      </div>
    </div>

    <div class="card">
      <h3>🎁 Daily Reward</h3>
      <p>Watch ads and earn NOVA tokens.</p>
    </div>

    <div class="message" id="message"></div>

    <div class="footer">
      NOVA Earn • Polygon Network
    </div>

  </div>

  <script>
    let balance = 0;
    let today = 0;
    let refs = 0;

    const reward = 0.015;

    function update() {
      document.getElementById("balance").textContent =
        balance.toFixed(3) + " NOVA";

      document.getElementById("today").textContent =
        today.toFixed(3) + " NOVA";

      document.getElementById("refs").textContent = refs;
    }

  function watchAd() {
  document.getElementById("message").textContent =
    "🎬 Ad system will be connected next.";
}
      document.getElementById("message").textContent =
        "🎉 You earned " + reward + " NOVA!";

      update();
    }

    function referral() {
      document.getElementById("message").textContent =
        "👥 Referral system will be connected soon.";
    }

    function withdraw() {
      document.getElementById("message").textContent =
        "💰 Withdrawal system will be connected soon.";
    }

    update();
  </script>

</body>
</html>
